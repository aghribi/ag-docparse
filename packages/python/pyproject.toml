[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "ag-docparse"
version = "0.6.0"
description = "LLM-powered document extraction SDK"
authors = ["Adnan Ghribi <aghribi@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/aghribi/ag-docparse"
repository = "https://github.com/aghribi/ag-docparse"
packages = [{ include = "ag_docparse" }]

[tool.poetry.scripts]
ag-docparse = "ag_docparse.cli:main"

[tool.poetry.dependencies]
python   = "^3.10"
pydantic = "^2.0"
httpx = ">=0.27,<1"
click    = "^8.0"

[tool.poetry.extras]
openai    = ["openai"]
anthropic = ["anthropic"]
pdf       = ["pdfplumber"]
all       = ["openai", "anthropic", "pdfplumber"]

[tool.poetry.dependencies.openai]
version  = ">=1.55.3,<2"
optional = true

[tool.poetry.dependencies.anthropic]
version  = ">=0.40,<3"
optional = true

[tool.poetry.dependencies.pdfplumber]
version  = "^0.11"
optional = true

[tool.poetry.group.dev.dependencies]
pytest         = "^8.0"
pytest-asyncio = "^0.23"
ruff           = "^0.4"
openai         = ">=1.55.3,<2"
pdfplumber     = "^0.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
